name: CI and container release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l api.go main.go unifi.go unifi_test.go)"
      - name: Regression tests with race detection
        run: go test -race -count=1 ./...
      - name: Static checks
        run: go vet ./...

  image-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: imjasonh/setup-ko@v0.7
        with:
          version: v0.17.1
      - name: Build supported image architectures without publishing
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
          GOFLAGS: -ldflags=-X=main.version=${{ github.sha }}
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          ko build --bare --push=false --oci-layout-path="$RUNNER_TEMP/bouncer-image" \
            --platform=linux/amd64,linux/arm64,linux/arm .
          python3 scripts/verify-image-layout.py "$RUNNER_TEMP/bouncer-image"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-ko@v0.7
        with:
          version: v0.17.1
      - name: Publish the exact release tag
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
        run: |
          export VERSION="${GITHUB_REF_NAME}"
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export GOFLAGS="-ldflags=-X=main.version=$VERSION"
          ko build --bare --tags="$VERSION" --oci-layout-path="$RUNNER_TEMP/bouncer-image" \
            --platform=linux/amd64,linux/arm64,linux/arm \
            --image-label="org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --image-label="org.opencontainers.image.revision=$GITHUB_SHA" \
            --image-label="org.opencontainers.image.version=$VERSION" . | tee image-reference.txt
          python3 scripts/verify-image-layout.py "$RUNNER_TEMP/bouncer-image"
          printf 'Published image: `%s`\n' "$(cat image-reference.txt)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: published-image-reference
          path: image-reference.txt
